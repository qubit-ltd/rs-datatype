name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qubit-ltd/rs-dependency-policy/.github/actions/check@39895c60b725068b7a72dc14d0ae18ee60c30e46

  rust-ci:
    uses: qubit-ltd/rs-ci/.github/workflows/rust-ci.yml@89562a86c0d9419595895b6dc45c8210ca70f59f
    with:
      cargo_fuzz_max_len: "16384"
      coverage_enforce_thresholds: "1"
    secrets: inherit
